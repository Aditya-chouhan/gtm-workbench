<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="250" viewBox="0 0 1120 250" role="img" aria-labelledby="title desc">
<title id="title">GTM Workbench workflow</title><desc id="desc">Evidence and task contracts lead to an assistant handoff, artifact review, and approved downstream work. Changed inputs invalidate affected approvals.</desc>
<rect width="1120" height="250" rx="20" fill="#0b1017"/>
<g font-family="system-ui,sans-serif"><text x="32" y="36" fill="#8be3c6" font-size="13" letter-spacing="3">GTM WORKBENCH / FROM EVIDENCE TO REVIEW</text>
<g fill="#121c28" stroke="#34475f"><rect x="32" y="70" width="224" height="104" rx="12"/><rect x="304" y="70" width="224" height="104" rx="12"/><rect x="576" y="70" width="224" height="104" rx="12"/><rect x="848" y="70" width="240" height="104" rx="12"/></g>
<g fill="#e5ecf5" font-size="19"><text x="52" y="108">Task + evidence</text><text x="324" y="108">Assistant handoff</text><text x="596" y="108">Artifact review</text><text x="868" y="108">Next task unlocked</text></g>
<g fill="#a7b8ce" font-size="13"><text x="52" y="141">Validate dependencies</text><text x="324" y="141">Bring your own assistant</text><text x="596" y="141">Approve an exact hash</text><text x="868" y="141">Keep the evidence chain</text></g>
<g fill="#8be3c6" font-size="26"><text x="269" y="128">→</text><text x="541" y="128">→</text><text x="813" y="128">→</text></g>
<text x="32" y="218" fill="#a7b8ce" font-size="14">Changed evidence or prerequisite → affected work becomes stale → review again</text></g></svg>
