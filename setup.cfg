[metadata]
name = gtm-workbench
version = attr: gtm_workbench.__version__
author = Aditya Chouhan
description = Local workflow ledger and agent handoffs for evidence-grounded GTM teams
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
license_files = LICENSE, THIRD_PARTY_NOTICES.md
keywords = gtm, agents, workflow, sales, marketing

[options]
packages = find:
python_requires = >=3.9

[options.packages.find]
include = gtm_workbench*

[options.entry_points]
console_scripts =
    gtm-workbench = gtm_workbench.__main__:main
